<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify- your favourite music is here</title>
    <link rel="stylesheet" href="style.css" />

</head>

<body>
    <nav>
        <ul>
            <li class="brand">
                <img src="logo.png" alt="spotify">spotify
            </li>
            <li>Home</li>
            <li>About</li>
        </ul>
    </nav>

    <div class="container">
        <h1>Best of Ncs - No Copyright Sounds </h1>

        <div class="songList"></div>
        <div class="songBanner"></div>
    </div>

    <div class="bottom">
        <input type="range" name="range" id="myprogressBar" min="0" max="100">
        <div class="icons">
            <!-- fontawesome icons -->
            <i class="fa-fa-3x fa-circle-play-backward"></i>
            <i class="fa-fa-3x fa-circle-play-circle"></i>
            <i class="fa-fa-3x fa-circle-play-forward"></i>

        </div>
    </div>S


    <script src="https://kit.fontawesome.com/1211dab50a.js" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>

</html>
